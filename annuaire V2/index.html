        // Fonction pour afficher les employés
        function displayEmployees(employeesToShow) {
            const table = document.getElementById('employeesTable');
            const tableBody = document.getElementById('employeesTableBody');
            const noResults = document.getElementById('noResults');
            
            if (employeesToShow.length === 0) {
                table.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            table.style.display = 'table';
            noResults.style.display = 'none';
            
            tableBody.innerHTML = employeesToShow.map(employee => `
                <tr>
                    <td><span class="pseudo-badge">${employee.PSEUDO}</span></td>
                    <td>${employee.NOM}</td>
                    <td>${employee.PRENOMS}</td>
                    <td>${employee.DEPARTEMENT}</td>
                    <td>${employee.TITRE}</td>
                    <td><a href="mailto:${employee.EMAIL}">${employee.EMAIL}</a></td>
                    <td><a href="tel:${employee.MOBILE}">${employee.MOBILE}</a></td>
                    <td>${employee.INTERPHONE || '-'}</td>
                </tr>
            `).join('');
        }

        // Fonction pour peupler les filtres
        function populateFilters() {
            const departments = [...new Set(employees.map(emp => emp.DEPARTEMENT))].sort();
            
            const deptFilter = document.getElementById('departmentFilter');
            
            departments.forEach(dept => {
                const option = document.createElement('option');
                option.value = dept;
                option.textContent = dept;
                deptFilter.appendChild(option);
            });
        }

        // Fonction de recherche
        function searchEmployees() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const deptFilter = document.getElementById('departmentFilter').value;
            
            const filtered = employees.filter(employee => {
                const matchesSearch = !searchTerm || 
                    employee.NOM.toLowerCase().includes(searchTerm) ||
                    employee.PRENOMS.toLowerCase().includes(searchTerm) ||
                    employee.PSEUDO.toLowerCase().includes(searchTerm) ||
                    employee.DEPARTEMENT.toLowerCase().includes(searchTerm) ||
                    employee.TITRE.toLowerCase().includes(searchTerm) ||
                    employee.EMAIL.toLowerCase().includes(searchTerm);
                
                const matchesDept = !deptFilter || employee.DEPARTEMENT === deptFilter;
                
                return matchesSearch && matchesDept;
            });
            
            displayEmployees(filtered);
            updateStats(filtered.length);
        }

        // Fonction pour mettre à jour les statistiques
        function updateStats(count) {
            document.getElementById('totalCount').textContent = count;
        }

        // Fonction pour effacer la recherche
        function clearSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('departmentFilter').value = '';
            searchEmployees();
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', searchEmployees);
        document.getElementById('departmentFilter').addEventListener('change', searchEmployees);
        document.getElementById('clearSearch').addEventListener('click', clearSearch);

        // Recherche en temps réel avec debounce
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(searchEmployees, 300);
        });
