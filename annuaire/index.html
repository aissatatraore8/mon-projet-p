            <div class="form-group">

            <div class="form-group">

            <div class="form-group">

            <div class="form-group">
                <label for="editFonction">GRADE/FONCTION:</label>

            <div class="form-buttons">

    // Afficher les données dans le tableau
    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        data.forEach((employee, index) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${employee.interphone}</td>
                <td>${employee.pseudo}</td>
                <td>${employee.nom}</td>
                <td>${employee.email}</td>
                <td>${employee.telephone}</td>
                <td>${employee.fonction}</td>
                <td><button class="edit-btn" onclick="openEditModal(${index})">Modifier</button></td>
            `;
            tbody.appendChild(row);
        });
    }

    // Recherche
    const searchInput = document.getElementById('searchInput');
    const clearSearch = document.getElementById('clearSearch');

    function filterTable() {
        const searchTerm = searchInput.value.toLowerCase();
        const filtered = employees.filter(emp => {
            return emp.interphone.toLowerCase().includes(searchTerm) ||
                   emp.pseudo.toLowerCase().includes(searchTerm) ||
                   emp.nom.toLowerCase().includes(searchTerm) ||
                   emp.email.toLowerCase().includes(searchTerm) ||
                   emp.telephone.toLowerCase().includes(searchTerm) ||
                   emp.fonction.toLowerCase().includes(searchTerm);
        });
        renderTable(filtered);
    }

    searchInput.addEventListener('input', filterTable);

    clearSearch.addEventListener('click', function() {
        searchInput.value = '';
        renderTable(employees);
    });

    // Modal d'édition
    const modal = document.getElementById('editModal');
    const editForm = document.getElementById('editForm');
    const cancelEdit = document.getElementById('cancelEdit');

    function openEditModal(index) {
        const employee = employees[index];
        document.getElementById('editIndex').value = index;
        document.getElementById('editInterphone').value = employee.interphone;
        document.getElementById('editPseudo').value = employee.pseudo;
        document.getElementById('editNom').value = employee.nom;
        document.getElementById('editEmail').value = employee.email;
        document.getElementById('editTelephone').value = employee.telephone;
        document.getElementById('editFonction').value = employee.fonction;
        modal.style.display = 'block';
    }

    cancelEdit.addEventListener('click', function() {
        modal.style.display = 'none';
    });

    editForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const index = document.getElementById('editIndex').value;
        employees[index] = {
            interphone: document.getElementById('editInterphone').value,
            pseudo: document.getElementById('editPseudo').value,
            nom: document.getElementById('editNom').value,
            email: document.getElementById('editEmail').value,
            telephone: document.getElementById('editTelephone').value,
            fonction: document.getElementById('editFonction').value
        };
        modal.style.display = 'none';
        filterTable();
    });

    // Fermer la modal si on clique en dehors
    window.addEventListener('click', function(e) {
        if (e.target === modal) {
            modal.style.display = 'none';
        }
    });

    // Initialisation
    renderTable(employees);
